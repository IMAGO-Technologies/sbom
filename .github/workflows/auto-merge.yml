name: Auto-merge Pull Requests

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    name: Merge pull request by ${{ github.actor }} - ${{github.event.pull_request.html_url}}
    steps:
      - name: Enable Pull Request Automerge
        run: gh pr merge --merge --auto
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
