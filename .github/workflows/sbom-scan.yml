name: SBOM Security Scan

on: workflow_dispatch

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    name: SBOM scan
    steps:
      - uses: actions/checkout@v6
      - name: Install grype
        shell: bash
        run: |
          wget https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_linux_amd64.deb
          sudo dpkg -i *.deb
          sudo apt-get update
          sudo apt-get install -y colorized-logs
      - name: Scan SBOM
        shell: bash
        run: |
          mkdir -p report
          sboms=$(ls *-sbom.cdx.json)
          while IFS= read -r sbom; do
            image=$(basename $sbom -sbom.cdx.json)
            echo "Scanning $image..."
            CLICOLOR_FORCE=true grype sbom:$sbom --file $image.txt --by-cve
            # cat $image.txt | ansi2html --title "$image" --no-wrap --style 'a {color: white;}' | sed -E 's/(CVE-[0-9]{4}-[0-9]{4,7})/<a href="https:\/\/security-tracker.debian.org\/tracker\/\1">\1<\/a>/g' > report/$image.html
            cat $image.txt | ansi2html --title "CVE $image" --no-wrap --style 'a {color: white;}' | sed -E 's/(CVE-[0-9]{4}-[0-9]{4,7})/<a href="https:\/\/deb.freexian.com\/extended-lts\/tracker\/\1">\1<\/a>/g' > report/$image.html
          done <<< "$sboms"
      - name: Generate Markdown File
        run: |
          cat << 'EOF' > report/index.md
          # IMAGO Technologies SBOM and Vulnerability Scan

          ## Linux Images

          The SBOMs for Linux images are provided in CycloneDX JSON format.
          All SBOMs are scanned for known vulnerabilities on a regular basis using [grype](https://github.com/anchore/grype).

          EOF
          echo "| Linux Image | SBOM | Vulnerability Scan ($(date --rfc-3339=date)) |"
          echo "| :--- | :--- | :--- |"
          sboms=$(ls *-sbom.cdx.json)
          while IFS= read -r sbom; do
            image=$(basename $sbom -sbom.cdx.json)
            echo "|$image|[$sbom](https://github.com/IMAGO-Technologies/sbom-scan/blob/master/$sbom)|[$image]$image.html|" >> report/index.md
          done <<< "$sboms"
      - name: Setup Pages Metadata
        uses: actions/configure-pages@v5
      - name: Build HTML using Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./report
          destination: ./_site
      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

  deploy:
    needs: sbom-scan

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
